        <form action="#" method="post">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br>

            <label for="service">Type of Service:</label>
            <select id="service" name="service" required>
                <option value="">Select the service</option>
                <option value="Scratch My Owne">Scratch My Owne</option>
                <option value="Scratch furniture">Scratch furniture</option>
                <option value="Wrecking the room">Wrecking the room</option>
                <option value="Stealing food">Stealing food</option>
            </select><br>

            <label for="message">Message:</label>
            <textarea id="message" name="message" ></textarea><br>

            <button type="submit">Submit</button><br>
            <button type="reset">Reset</button>
        </form>
